<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f2" />
    <title>砂時計</title>
    <link rel="icon" type="image/svg+xml" href="./hourglass-favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260710a" />
    <style>
      .auth-overlay {
        position: fixed !important;
        inset: 0 !important;
        z-index: 9999 !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        background: var(--bg, #f2e9d8);
        padding: 24px;
      }
      .auth-overlay[hidden] { display: none !important; }
      .auth-card {
        background: var(--surface, rgba(255,253,246,0.96));
        border-radius: 26px;
        box-shadow: 0 18px 44px rgba(110,85,50,0.13);
        padding: 32px 28px;
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .auth-logo { display: flex; align-items: center; gap: 10px; justify-content: center; }
      .auth-logo__name { font-size: 1.2rem; font-weight: 700; color: var(--ink, #2c2820); letter-spacing: .03em; }
      .auth-tabs { display: flex; gap: 4px; background: rgba(0,0,0,.06); border-radius: 12px; padding: 4px; }
      .auth-tab { flex: 1; background: none; border: none; border-radius: 9px; padding: 8px 0; font-size: .88rem; color: var(--muted, #7e7265); cursor: pointer; transition: background .15s, color .15s; }
      .auth-tab.is-active { background: var(--surface, #fff); color: var(--ink, #2c2820); font-weight: 600; box-shadow: 0 2px 8px rgba(110,85,50,.1); }
      .auth-form { display: flex; flex-direction: column; gap: 14px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field__label { font-size: .82rem; color: var(--muted, #7e7265); font-weight: 500; }
      .field__input { background: rgba(0,0,0,.04); border: 1.5px solid rgba(0,0,0,.1); border-radius: 10px; padding: 10px 12px; font-size: .95rem; color: var(--ink, #2c2820); outline: none; font-family: inherit; }
      .field__input:focus { border-color: var(--accent, #c75e33); }
      .auth-error { font-size: .83rem; color: var(--danger, #b04040); text-align: center; margin: 0; line-height: 1.4; }
      .auth-hint { font-size: .82rem; color: var(--muted, #7e7265); text-align: center; margin: 0; }
      .auth-switch { background: none; border: none; color: var(--accent, #c75e33); cursor: pointer; font-size: inherit; padding: 0; text-decoration: underline; font-family: inherit; }
      .auth-loading { display:flex; align-items:center; justify-content:center; margin:10px 0; }
      .auth-spinner { width:26px; height:26px; border:2.5px solid rgba(126,114,101,0.2); border-top-color:var(--muted,#7e7265); border-radius:50%; animation:spin .75s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      .auth-submit { width: 100%; }
      .auth-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--muted, #7e7265);
        font-size: .86rem;
        text-align: center;
        margin: 0;
      }
      .auth-overlay[data-auth-state="checking"] .auth-tabs,
      .auth-overlay[data-auth-state="checking"] .auth-form,
      .auth-overlay[data-auth-state="checking"] .auth-hint,
      .auth-overlay[data-auth-state="checking"] .auth-guest-sep,
      .auth-overlay[data-auth-state="checking"] .auth-guest-btn {
        display: none !important;
      }
      .auth-overlay[data-auth-state="ready"] .auth-status {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="ambient ambient--left" aria-hidden="true"></div>
      <div class="ambient ambient--right" aria-hidden="true"></div>

      <div class="device-frame">
        <header class="topbar">
          <div class="topbar__brand">
            <span class="brand-chip">砂時計</span>
            <p class="topbar__date" id="today-label"></p>
          </div>
          <button
            type="button"
            class="ghost-button"
            id="setup-shortcut"
            data-action="open-setup"
          >
            設定
          </button>
        </header>

        <div class="guest-banner" id="guest-banner" hidden>
          <span class="guest-banner__text">端末保存中</span>
          <button type="button" class="guest-banner__btn" onclick="showAuthFromBanner()">保存</button>
          <button type="button" class="guest-banner__close" onclick="dismissGuestBanner()" aria-label="閉じる">✕</button>
        </div>

        <main class="screen-frame" id="screen-root" aria-live="polite"></main>

        <nav class="tabbar" id="bottom-nav" aria-label="主要画面">
          <button type="button" class="tabbar__item" data-action="navigate" data-view="today">
            <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <circle cx="12" cy="12" r="4.5"/>
              <rect x="11" y="1" width="2" height="3" rx="1"/>
              <rect x="11" y="20" width="2" height="3" rx="1"/>
              <rect x="1" y="11" width="3" height="2" rx="1"/>
              <rect x="20" y="11" width="3" height="2" rx="1"/>
              <rect x="4.22" y="4.93" width="2" height="3" rx="1" transform="rotate(-45 4.22 4.93)"/>
              <rect x="17.66" y="4.93" width="2" height="3" rx="1" transform="rotate(45 17.66 4.93)"/>
              <rect x="4.22" y="18.36" width="2" height="3" rx="1" transform="rotate(45 4.22 18.36)"/>
              <rect x="17.66" y="18.36" width="2" height="3" rx="1" transform="rotate(-45 17.66 18.36)"/>
            </svg>
            <span>Today</span>
          </button>
          <button type="button" class="tabbar__item" data-action="navigate" data-view="tasks">
            <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none">
              <rect x="4" y="3" width="16" height="18" rx="3" fill="currentColor" opacity="0.18"/>
              <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M5.8 8.2l1.1 1.1 2-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Task</span>
          </button>
          <button type="button" class="tabbar__item" data-action="navigate" data-view="review">
            <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <rect x="3" y="13" width="4" height="8" rx="1"/>
              <rect x="10" y="7" width="4" height="14" rx="1"/>
              <rect x="17" y="3" width="4" height="18" rx="1"/>
            </svg>
            <span>Review</span>
          </button>
        </nav>
      </div>
    </div>

    <div class="sheet" id="session-sheet" hidden></div>
    <div class="toast" id="toast" hidden></div>

    <div class="auth-overlay" id="auth-overlay" data-auth-state="checking">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
        <rect x="5" y="5" width="38" height="38" rx="11" fill="#111c18"/>
        <path d="M16 13H32M16 35H32M19 13C19 20 22 23 24 24C22 25 19 28 19 35M29 13C29 20 26 23 24 24C26 25 29 28 29 35" fill="none" stroke="#f5efe0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20.4 18.6C22.2 19.8 25.8 19.8 27.6 18.6L25.3 23H22.7L20.4 18.6Z" fill="#d5b764"/>
        <path d="M24 24.6V30.2" stroke="#d5b764" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M20.5 32.2C22.1 29.2 25.9 29.2 27.5 32.2H20.5Z" fill="#d5b764"/>
      </svg>
      <span class="auth-logo__name">砂時計</span>
    </div>

    <p class="auth-status" id="auth-status">
      <span class="auth-spinner" aria-hidden="true"></span>
      前回の状態を確認しています
    </p>

    <div class="auth-tabs" id="auth-tabs">
      <button type="button" class="auth-tab is-active" data-auth-tab="login">ログイン</button>
      <button type="button" class="auth-tab" data-auth-tab="signup">新規登録</button>
    </div>

    <form class="auth-form" id="auth-form" autocomplete="on">
      <div class="field">
        <label class="field__label" for="auth-email">メールアドレス</label>
        <input class="field__input" type="email" id="auth-email" name="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label class="field__label" for="auth-password">パスワード</label>
        <input class="field__input" type="password" id="auth-password" name="password" required autocomplete="current-password" placeholder="8文字以上" minlength="8" />
      </div>
      <p class="auth-error" id="auth-error" hidden></p>
      <button type="submit" class="action-button action-button--primary auth-submit" id="auth-submit">ログイン</button>
    </form>

    <p class="auth-hint" id="auth-hint">
      アカウントをお持ちでないですか？
      <button type="button" class="auth-switch" id="auth-switch-btn">新規登録はこちら</button>
    </p>

    <div class="auth-loading" id="auth-loading" hidden><div class="auth-spinner"></div></div>
      <div class="auth-guest-sep"><span>または</span></div>
      <button type="button" class="auth-guest-btn" id="auth-guest-btn">登録なしで試してみる →</button>
  </div>
</div>

    <script src="./supabase.js"></script>
    <script src="./app.js?v=20260710a"></script>
  </body>
</html>
